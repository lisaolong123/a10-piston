<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>A10 Piston</title>
<link rel="manifest" href="/manifest.webmanifest" />
<script>
if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
<style>
:root{--p:#111;--b:#0af;--g:#0c0;--r:#f44;--bg:#f5f7fb;--card:#fff;}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--p)}
.wrap{max-width:760px;margin:0 auto;padding:12px}
h1{margin:0 0 8px}
.card{background:var(--card);border-radius:12px;padding:12px;margin:8px 0;box-shadow:0 2px 8px #0001}
.btn{display:inline-block;padding:10px 14px;border-radius:10px;background:var(--b);color:#fff;border:0;cursor:pointer;margin:4px 0}
.btn:active{filter:brightness(.9)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{display:block;margin:8px 0 4px}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #ccd;background:#fff;font:inherit}
.status{margin-top:8px;color:#555}
#log{white-space:pre-wrap;max-height:220px;overflow:auto;background:#0b1020;color:#9f9;padding:10px;border-radius:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>A10 Piston（Vorze Piston 控制）</h1>
  <div class="card">
    <button class="btn" id="connect">连接 VorzePiston（蓝牙）</button>
    <div class="status" id="status">未连接</div>
  </div>

  <div class="card">
    <label>周期（秒，示例 1-10）</label>
    <input id="period" type="number" min="1" max="60" value="3" />
    <label>浅（0-255）</label>
    <input id="shallow" type="number" min="0" max="255" value="0" />
    <label>深（0-255）</label>
    <input id="deep" type="number" min="0" max="255" value="200" />
    <label>速度（% 10-100）</label>
    <input id="speed" type="number" min="10" max="100" value="20" />
    <div class="row">
      <button class="btn" id="gen">生成脚本（文本）</button>
      <button class="btn" id="start">开始同步</button>
      <button class="btn" id="stop">停止</button>
    </div>
    <div class="status" id="info"></div>
  </div>

  <div class="card">
    <div>日志</div>
    <div id="log"></div>
  </div>
</div>

<script>
const $=(id)=>document.getElementById(id);
const log=(m)=>{$("log").textContent+=(m+"\n");console.log(m)};
let device=null,server=null,char=null;
// 你之前验证过的通道（按实际保留/调整）
const SRV="0000fff0-0000-1000-8000-00805f9b34fb";
const CHR="0000fff1-0000-1000-8000-00805f9b34fb";

$("connect").onclick=async()=>{
  try{
    device=await navigator.bluetooth.requestDevice({filters:[{services:[SRV]}]});
    server=await device.gatt.connect();
    const svc=await server.getPrimaryService(SRV);
    char=await svc.getCharacteristic(CHR);
    $("status").textContent="已连接："+device.name;
    log("connected "+device.name);
  }catch(e){log("连接失败:"+e.message);$("status").textContent="连接失败"}
};

function buildCmd({shallow,deep,speed,period}){
  // 占位：按你已验证的协议替换此处（保持 20%速度/深浅/周期语义）
  return new Uint8Array([0x01, shallow&0xff, deep&0xff, speed&0xff, period&0xff, 0x00,0x00,0x00]);
}

$("gen").onclick=()=>{
  const p={shallow:+$(shallow).value,deep:+$(deep).value,speed:+$(speed).value,period:+$(period).value};
  const cmd=buildCmd(p);
  $("info").textContent="生成指令字节: "+[...cmd].map(b=>b.toString(16).padStart(2,"0")).join(" ");
  log("gen: "+JSON.stringify(p)+" -> "+[...cmd].map(b=>b.toString(16).padStart(2,"0")).join(" "));
};

$("start").onclick=async()=>{
  if(!char){log("未连接");return}
  const p={shallow:+$(shallow).value,deep:+$(deep).value,speed:+$(speed).value,period:+$(period).value};
  const cmd=buildCmd(p);
  await char.writeValue(cmd);
  log("start sent");
};
$("stop").onclick=async()=>{ if(char) await char.writeValue(new Uint8Array([0x00,0,0,0,0,0,0,0])); log("stop") };
</script>
</body>
</html>
